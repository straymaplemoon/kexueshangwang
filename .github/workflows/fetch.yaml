name: Refresh subscription sources

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'pre_check.py'
      - 'requirements.txt'
      - 'config.yaml'
      - '.github/workflows/fetch.yaml'
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

concurrency:
  group: refresh-subscription-sources
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch and check subscription sources
        run: python main.py

      - name: Commit refreshed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.yaml sub/
          if git diff --cached --quiet; then
            echo "No subscription changes to commit."
          else
            git commit -m "Refresh subscription sources"
            git push
          fi

